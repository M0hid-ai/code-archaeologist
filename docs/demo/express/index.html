.panel { background: var(--surface-1); border: 1px solid var(--rule); border-radius: var(--radius); padding: 16px; }

  .nav, .controls { display: none; }

st commit. That was 17 years and 6,186 commits ago. Along the way 386 people wrote 131,046 lines and deleted 103,190. Of everything ever written, 27,354 lines survive today across 213 files. 568 files did not make it. They rest in the Graveyard.","eras":[{"id":0,"title":"The Founding","story":"This era spans 11 months and 1,327 commits. Tj Holowaychuk carried it almost single-handedly (92% of all commits). It was the last era for csausdev and ciaranj. The codebase grew by 9,830 lines net (24,430 written, 14,600 erased). 201 files were born and 72 were buried. Most digging happened in lib/, spec/ and examples/. Releases shipped: 0.0.1, 0.0.2, 0.1.0, 0.2.0 and 15 others."},{"id":1,"title":"The Great Purge","story":"This era spans 11 months and 1,327 commits. Tj Holowaychuk carried it almost single-handedly (96% of all commits). New faces arrived: Nick Poulden, Dav Glass and Roman Shtylman. It was the last era for Nick Poulden and Dav Glass. The codebase grew by 4,151 lines net (47,702 written, 43,551 erased). 255 files were born and 182 were buried. Most digging happened in docs/, lib/ and examples/. Releases shipped: 0.10.1, 0.11.0, 0.12.0, 0.13.0 and 27 others."},{"id":2,"title":"The Gold Rush","story":"Over 3 years starting April 2011, the project saw 1,866 commits from 136 contributors. Tj Holowaychuk carried it almost single-handedly (74% of all commits). New faces arrived: Douglas Christopher Wilson, Jonathan Ong, Robert Sköld and 9 others. It was the last era for Tj Holowaychuk, Roman Shtylman, Aaron Heckmann and 9 others. The codebase grew by 1,212 lines net (32,378 written, 31,166 erased). 244 files were born and 245 were buried. Most digging happened in test/, lib/ and the project root. Releases shipped: 2.2.1, 2.2.2, 2.3.0, 2.3.1 and 97 others."},{"id":3,"title":"The Age of Upkeep","story":"From June 2014 to June 2016, 62 people made 795 commits. Douglas Christopher Wilson carried it almost single-handedly (90% of all commits). New faces arrived: Mike Tunn  16 others."}],"epilogue":"Today express stands at 27,354 lines. In its latest era, \"The Present Day\", dependabot[bot], Ulises Gascón and Wes Todd keep it moving. The dig continues with every commit.","placards":{"timeline":"Every bar is a month of work. Coloured bands mark the 7 eras this project lived through; plaques mark the moments that mattered.","timelapse":"Watch express grow from its first file to 213. Each tile is a file, sized by its line count and grouped by top-level directory. Outlined tiles are newborn; tiles that shrink away have died. Press play, and turn the sound on.","survivors":"sendfile() in lib/response.js was written by Douglas Christopher Wilson on 2014-08-21 and has survived 99 commits to its file, 10 of them refactors. The oldest living definition is authenticate(), dating from 2010-09-22.","strata":"Like rock layers, each band shows how many surviving lines were written in that year (from 150 excavated files).","battlefield":"lib/response.js is the most contested ground: 397 commits by 85 people, 83 of them bug fixes. The fiercest tug-of-war: Aaron Heckmann vs Tj Holowaychuk over Readme.md (6 skirmishes).","graveyard":"568 files lie buried here, taking 39,455 lines with them. The most prolific reaper: Tj Holowaychuk, with 463 deletions. 24 of the dead rose again.","gallery":"386 people shaped express. Each portrait shows when they were active and what kind of contributor they were.","constellations":"Files that keep changing together, whether or not they live near each other. 7 of these pairs cross directory boundaries: hidden dependencies.","rhythm":"8% of commits happened between midnight and 5am (in the author's own timezone) and 14% on weekends. The busiest day ever was 2009-12-03, with 84 commits.","archive":"The raw record: the 3,000 most recent commits. Search by message, author or hash."}}}</script>
<script>
/* 00-core.js */
/* Core helpers shared by every wing of the museum. */
"use strict";

const R = JSON.parse(document.getElementById("museum-data").textContent);
const Museum = { wings: [], data: R };

const SERIES = ["--series-1", "--series-2", "--series-3", "--series-4", "--series-5", "--series-6", "--series-7", "--series-8"];
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const seriesColor = (i) => (i < SERIES.length ? css(SERIES[i]) : css("--series-other"));

/* Mood groups: ten raw moods fold into five readable categories (fixed slot order). */
const MOOD_GROUPS = [
  { id: "feature", label: "Features", moods: ["feature"] },
  { id: "fix", label: "Fixes", moods: ["fix", "panic", "revert"] },
  { id: "refactor", label: "Refactors", moods: ["refactor"] },
  { id: "docs", label: "Docs & tests", moods: ["docs", "test"] },
  { id: "chore", label: "Chores & merges", moods: ["chore", "merge"] },
];
const moodGroupOf = (m) => MOOD_GROUPS.findIndex((g) => g.moods.includes(m));
const moodColor = (m) => {
  const i = moodGroupOf(m);
  return i === -1 ? css("--series-other") : seriesColor(i);
};

const fmt = (n) => (typeof n === "number" ? n.toLocaleString("en") : n);
const compact = (n) =>
  n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M" : n >= 1e4 ? Math.round(n / 1e3) + "k" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n);
const date = (t) => new Date(t * 1000).toLocaleDateString("en", { year: "numeric", month: "short", day: "numeric", timeZone: "UTC" });
const monthLabel = (t) => new Date(t * 1000).toLocaleDateString("en", { year: "numeric", month: "short", timeZone: "UTC" });
const year = (t) => new Date(t * 1000).getUTCFullYear();
const pct = (x) => Math.round(x * 100) + "%";
const plural = (n, w) => `${fmt(n)} ${w}${n === 1 ? "" : "s"}`;
function duration(sec) {
  const d = sec / 86400;
  if (d >= 730) return Math.round(d / 365) + " years";
  if (d >= 365) return "1 year";
  if (d >= 60) return Math.round(d / 30.4) + " months";
  if (d >= 2) return Math.round(d) + " days";
  const h = sec / 3600;
  return h >= 2 ? Math.round(h) + " hours" : "under 2 hours";
}

/** Tiny DOM builder: h("div.card", {title: "x"}, child, "text", ...) */
function h(spec, attrs, ...children) {
  const [tag, ...classes] = spec.split(".");
  const el = document.createElement(tag || "div");
  if (classes.length) el.className = classes.join(" ");
  if (attrs && (typeof attrs !== "object" || attrs instanceof Node || Array.isArray(attrs))) {
    children.unshift(attrs);
    attrs = null;
  }
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "style" && typeof v === "object") Object.assign(el.style, v);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  appendAll(el, children);
  return el;
}
function appendAll(el, children) {
  for (const c of children.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
}

const SVGNS = "http://www.w3.org/2000/svg";
function s(tag, attrs, ...children) {
  const el = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) el.setAttribute(k, v);
  for (const c of children.flat(Infinity)) {
    if (c == null) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

/* ---------- tooltip ---------- */
const tip = document.getElementById("tooltip");
function showTip(evt, content) {
  tip.replaceChildren(...(Array.isArray(content) ? content : [content]).map((c) => (c instanceof Node ? c : h("div", { html: c }))));
  tip.classList.add("on");
  moveTip(evt);
}
function moveTip(evt) {
  const pad = 14;
  const r = tip.getBoundingClientRect();
  let x = evt.clientX + pad;
  let y = evt.clientY + pad;
  if (x + r.width > innerWidth - 8) x = evt.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = evt.clientY - r.height - pad;
  tip.style.left = Math.max(8, x) + "px";
  tip.style.top = Math.max(8, y) + "px";
}
function hideTip() {
  tip.classList.remove("on");
}
/** Attach a hover tooltip; `content` may be a function evaluated on hover. */
function tooltip(el, content) {
  el.addEventListener("pointerenter", (e) => showTip(e, typeof content === "function" ? content(e) : content));
  el.addEventListener("pointermove", moveTip);
  el.addEventListener("pointerleave", hideTip);
  return el;
}
const ttRow = (k, v) => `<div class="tt-row"><span>${esc(k)}</span><b>${esc(v)}</b></div>`;
function esc(x) {
  return String(x).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

/* ---------- shared pieces ---------- */
function wingHead(kicker, title, placardKey) {
  const text = R.narrative.placards[placardKey];
  return h(
    "header.wing-head",
    h("div.wing-kicker", kicker),
    h("h2", title),
    text ? h("p.placard" + (R.narrative.source !== "offline" ? ".ai" : ""), text) : null,
  );
}
function empty(msg) {
  return h("p.empty", msg);
}
/** Horizontal labelled bars (single series, text in ink colours). */
function barList(rows, color) {
  const max = Math.max(1, ...rows.map((r) => r.value));
  return h(
    "div.bars",
    rows.map((r) =>
      tooltip(
        h(
          "div.bar-row",
          h("span", { title: r.label }, r.label),
          h("div.track", h("div.fill", { style: { width: Math.max(1, (r.value / max) * 100) + "%", background: color } })),
          h("span.n", fmt(r.value)),
        ),
        r.tip || `<b>${esc(r.label)}</b><br>${fmt(r.value)}`,
      ),
    ),
  );
}
/** Small inline sparkline. */
function sparkline(values, color, w = 220, hgt = 36) {
  const max = Math.max(1, ...values);
  const step = values.length > 1 ? w / (values.length - 1) : w;
  const pts = values.map((v, i) => `${(i * step).toFixed(1)},${(hgt - 2 - (v / max) * (hgt - 6)).toFixed(1)}`);
  return s(
    "svg",
    { viewBox: `0 0 ${w} ${hgt}`, class: "chart", preserveAspectRatio: "none", style: `height:${hgt}px` },
    s("polyline", { points: `0,${hgt} ${pts.join(" ")} ${w},${hgt}`, fill: color, "fill-opacity": 0.18, stroke: "none" }),
    s("polyline", { points: pts.join(" "), fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }),
  );
}
/** Deterministic hash for identicons and stable colours. */
function hash(str) {
  let x = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    x ^= str.charCodeAt(i);
    x = Math.imul(x, 0x01000193);
  }
  return x >>> 0;
}
/** 5x5 mirrored identicon: no network, no emails, just a name. */
function identicon(name) {
  const hv = hash(name);
  const color = seriesColor(hv % 8);
  const cells = [];
  for (let y = 0; y < 5; y++)
    for (let x = 0; x < 3; x++) {
      if ((hv >> (y * 3 + x)) & 1) {
        cells.push(s("rect", { x: x * 10 + 1, y: y * 10 + 1, width: 9, height: 9, rx: 2, fill: color }));
        if (x < 2) cells.push(s("rect", { x: (4 - x) * 10 + 1, y: y * 10 + 1, width: 9, height: 9, rx: 2, fill: color }));
      }
    }
  return s("svg", { viewBox: "-4 -4 59 59", class: "identicon", "aria-hidden": "true" }, cells);
}
/** A <details> table view so no chart is colour-only. */
function tableView(label, headers, rows) {
  return h(
    "details.table-view",
    h("summary", label),
    h("table.data", h("thead", h("tr", headers.map((x) => h("th", x)))), h("tbody", rows.map((r) => h("tr", r.map((c) => h("td", c)))))),
  );
}
/** Resize-aware canvas with device-pixel-ratio scaling. */
function hiDpiCanvas(canvas, draw) {
  const fit = () => {
    const r = canvas.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(ctx, r.width, r.height);
  };
  new ResizeObserver(fit).observe(canvas);
  return fit;
}

/* 10-entrance.js */
/* Wing 1: the Entrance Hall. */
Museum.wings.push({
  id: "entrance",
  nav: "Entrance",
  render() {
    const o = R.overview;
    const years = (o.lastCommit - o.firstCommit) / (365 * 86400);
    const langs = o.languages.filter((l) => l.lines > 0 && l.name !== "Other");
    const unknownLines = o.languages.filter((l) => l.name === "Other").reduce((a, l) => a + l.lines, 0);
    const totalLang = langs.reduce((a, l) => a + l.lines, 0) + unknownLines || 1;
    const shownLangs = langs.slice(0, 7);
    const otherLines = langs.slice(7).reduce((a, l) => a + l.lines, 0) + unknownLines;
    const segs = shownLangs.map((l, i) => ({ label: l.name, lines: l.lines, color: seriesColor(i) }));
    if (otherLines) segs.push({ label: "Other", lines: otherLines, color: css("--series-other") });

    return h(
      "section.wing.hero",
      { id: "entrance" },
      h("div.kicker", o.truncated ? "An excavation of recent history" : "A museum of code history"),
      h("h1", o.name),
      h("div.span", `${date(o.firstCommit)}  to  ${date(o.lastCommit)}`),
      h("p.prologue" + (R.narrative.source !== "offline" ? ".ai" : ""), R.narrative.prologue),
      h(
        "div.tiles",
        [
          [fmt(o.commits), "commits"],
          [fmt(o.contributors), o.contributors === 1 ? "contributor" : "contributors"],
          [years >= 1 ? years.toFixed(1) : Math.max(1, Math.round(years * 365)), years >= 1 ? "years of history" : "days of history"],
          [compact(o.linesAlive), "lines alive"],
          [fmt(o.filesDead), "files buried"],
          [fmt(o.tags), o.tags === 1 ? "release tag" : "release tags"],
        ].map(([v, k]) => h("div.tile", h("div.v", v), h("div.k", k))),
      ),
      segs.length
        ? h(
            "div",
            h(
              "div.langbar",
              { role: "img", "aria-label": "Languages by surviving lines" },
              segs.map((sg) =>
                tooltip(h("span", { style: { width: (sg.lines / totalLang) * 100 + "%", background: sg.color } }), `<b>${esc(sg.label)}</b><br>${fmt(sg.lines)} lines (${pct(sg.lines / totalLang)})`),
              ),
            ),
            h("div.legend", segs.map((sg) => h("span", h("i", { style: { background: sg.color } }), `${sg.label} ${sg.lines / totalLang < 0.01 ? "<1%" : pct(sg.lines / totalLang)}`))),
          )
        : null,
      h("div.scroll-cue", "Scroll to enter the museum ↓"),
    );
  },
});

/* 20-timeline.js */
/* Wing 2: the Timeline Hall. Monthly activity, eras, and milestone plaques. */
function timelineChart() {
  const months = R.months;
  if (!months.length) return empty("No commits to chart.");
  const W = 1100;
  const H = 300;
  const m = { t: 34, r: 8, b: 30, l: 40 };
  const iw = W - m.l - m.r;
  const ih = H - m.t - m.b;
  const n = months.length;
  const bw = iw / n;
  const gap = bw >= 6 ? 2 : bw >= 3 ? 1 : 0;
  const stacks = months.map((p) => MOOD_GROUPS.map((g) => g.moods.reduce((a, k) => a + (p.moods[k] || 0), 0)));
  const other = months.map((p, i) => p.commits - stacks[i].reduce((a, b) => a + b, 0));
  const max = Math.max(1, ...months.map((p) => p.commits));
  const y = (v) => m.t + ih - (v / max) * ih;
  const x = (i) => m.l + i * bw;
  const tOf = (t) => {
    const first = months[0].t;
    const last = months[n - 1].t + 31 * 86400;
    return m.l + ((t - first) / (last - first)) * iw;
  };

  const g = [];
  // Era bands (alternating neutral shading) with serif labels.
  R.eras.forEach((e, k) => {
    const x0 = Math.max(m.l, tOf(e.start));
    const x1 = Math.min(m.l + iw, tOf(e.end));
    if (k % 2 === 0) g.push(s("rect", { x: x0, y: m.t - 26, width: Math.max(0, x1 - x0), height: ih + 26, fill: css("--surface-2"), opacity: 0.55 }));
    const label = (R.narrative.eras.find((x2) => x2.id === e.id) || e).title || e.name;
    const numeral = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X"][k] || String(k + 1);
    const text = x1 - x0 > 60 ? (label.length * 6.5 > x1 - x0 ? label.slice(0, Math.floor((x1 - x0) / 7)) + "…" : label) : x1 - x0 > 14 ? numeral : null;
    if (text) {
      const t = s("text", { x: x0 + 6, y: m.t - 10, class: "era-label" }, text);
      tooltip(t, `<b>${numeral}. ${esc(label)}</b><br>${monthLabel(e.start)} – ${monthLabel(e.end)}`);
      g.push(t);
    }
  });
  // Grid + axis.
  const ticks = [0, 0.5, 1].map((f) => Math.round(max * f));
  for (const t of ticks) {
    g.push(s("line", { x1: m.l, x2: m.l + iw, y1: y(t), y2: y(t), stroke: css("--rule"), "stroke-dasharray": t ? "2 4" : null }));
    g.push(s("text", { x: m.l - 6, y: y(t) + 4, "text-anchor": "end" }, compact(t)));
  }
  let lastYear = null;
  months.forEach((p, i) => {
    const yr = year(p.t);
    if (yr !== lastYear && (i === 0 || new Date(p.t * 1000).getUTCMonth() === 0)) {
      if (n < 400 || yr % 2 === 0) g.push(s("text", { x: x(i) + 1, y: H - 10 }, yr));
      lastYear = yr;
    }
  });
  // Stacked bars, one segment per mood group (fixed slot order), surface gaps between segments.
  months.forEach((p, i) => {
    let acc = 0;
    const parts = [...stacks[i], other[i]];
    parts.forEach((v, k) => {
      if (!v) return;
      const y1 = y(acc);
      const y0 = y(acc + v);
      const hgt = Math.max(0.5, y1 - y0 - (gap && acc ? 1 : 0));
      g.push(s("rect", { x: x(i) + gap / 2, y: y0, width: Math.max(0.6, bw - gap), height: hgt, fill: k < MOOD_GROUPS.length ? seriesColor(k) : css("--series-other"), rx: bw > 8 ? 2 : 0 }));
      acc += v;
    });
  });
  // Release ticks.
  const tags = R.milestones.filter((ms) => ms.kind === "release");
  for (const t of tags) {
    const tx = tOf(t.t);
    const tick = s("path", { d: `M${tx},${m.t + ih + 2} l4,7 h-8 z`, fill: css("--gold") });
    g.push(tick);
  }
  // Hover columns (hit targets wider than marks).
  const hits = months.map((p, i) => {
    const r = s("rect", { x: x(i), y: m.t - 26, width: Math.max(bw, 2), height: ih + 26, fill: "transparent" });
    tooltip(r, () => {
      const rows = MOOD_GROUPS.map((mg, k) => (stacks[i][k] ? ttRow(mg.label, fmt(stacks[i][k])) : "")).join("");
      return `<b>${monthLabel(p.t)}</b>${ttRow("Commits", fmt(p.commits))}${ttRow("Contributors", fmt(p.authors))}${ttRow("Lines +/-", `+${compact(p.added)} / -${compact(p.deleted)}`)}<hr style="border:0;border-top:1px solid var(--rule);margin:6px 0">${rows}`;
    });
    return r;
  });
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, class: "chart", role: "img", "aria-label": "Commits per month, stacked by kind of work, with eras shaded" }, g, hits);

  const legend = h(
    "div.legend",
    MOOD_GROUPS.map((mg, k) => h("span", h("i", { style: { background: seriesColor(k) } }), mg.label)),
    h("span", h("i", { style: { background: css("--series-other") } }), "Other"),
    tags.length ? h("span", h("i", { style: { background: css("--gold"), borderRadius: "0", clipPath: "polygon(50% 0,100% 100%,0 100%)" } }), "Release") : null,
  );
  const table = tableView(
    "Show monthly data as a table",
    ["Month", "Commits", "Contributors", "Added", "Deleted"],
    months.filter((p) => p.commits).map((p) => [monthLabel(p.t), fmt(p.commits), fmt(p.authors), fmt(p.added), fmt(p.deleted)]),
  );
  return h("div.panel", svg, legend, table);
}

/* 30-timelapse.js */
/* Wing 3: the Timelapse Theater. An animated treemap of the codebase across its whole life. */

/** Squarified treemap layout (Bruls et al.), preserving the given item order. */
function squarify(items, x, y, w, h) {
  const out = [];
  const total = items.reduce((a, it) => a + it.value, 0);
  if (!total || w <= 0 || h <= 0) return out;
  const scale = (w * h) / total;
  let rest = items.filter((it) => it.value > 0).map((it) => ({ it, area: it.value * scale }));
  let rx = x, ry = y, rw = w, rh = h;
  const worst = (row, side) => {
    const sum = row.reduce((a, r) => a + r.area, 0);
    let max = 0, min = Infinity;
    for (const r of row) { max = Math.max(max, r.area); min = Math.min(min, r.area); }
    const s2 = sum * sum, side2 = side * side;
    return Math.max((side2 * max) / s2, s2 / (side2 * min));
  };
  while (rest.length) {
    const side = Math.min(rw, rh);
    const row = [rest[0]];
    let i = 1;
    while (i < rest.length && worst([...row, rest[i]], side) <= worst(row, side)) row.push(rest[i++]);
    rest = rest.slice(i);
    const sum = row.reduce((a, r) => a + r.area, 0);
    if (rw >= rh) {
      const cw = sum / rh;
      let cy = ry;
      for (const r of row) { const ch = r.area / cw; out.push({ it: r.it, x: rx, y: cy, w: cw, h: ch }); cy += ch; }
      rx += cw; rw -= cw;
    } else {
      const ch = sum / rw;
      let cx = rx;
      for (const r of row) { const cw = r.area / ch; out.push({ it: r.it, x: cx, y: ry, w: cw, h: ch }); cx += cw; }
      ry += ch; rh -= ch;
    }
  }
  return out;
}

function timelapseTheater() {
  const T = R.timelapse;
  if (!T.frames.length || !T.files.length) return empty("Not enough history to film a timelapse.");
  const F = T.frames.length;
  const N = T.files.length;
  const sizes = T.frames.map((fr) => {
    const arr = new Float32Array(N);
    for (let i = 0; i < fr.sizes.length; i += 2) arr[fr.sizes[i]] = fr.sizes[i + 1];
    return arr;
  });
  // Directory order and colour are fixed for the whole film (by peak size), so tiles never repaint.
  const dirPeak = new Map();
  sizes.forEach((arr) => {
    const per = new Map();
    T.files.forEach((f, i) => arr[i] && per.set(f.dir, (per.get(f.dir) || 0) + arr[i]));
    per.forEach((v, d) => dirPeak.set(d, Math.max(dirPeak.get(d) || 0, v)));
  });
  const dirs = [...dirPeak.entries()].sort((a, b) => b[1] - a[1]).map(([d]) => d);
  const dirColor = new Map(dirs.map((d, i) => [d, i < 7 ? seriesColor(i) : css("--series-other")]));
  const filesByDir = new Map(dirs.map((d) => [d, []]));
  T.files.forEach((f, i) => filesByDir.get(f.dir) && filesByDir.get(f.dir).push(i));

  const canvas = h("canvas", { role: "img", "aria-label": "Animated treemap of files over time" });
  const dateEl = h("div.date");
  const statsEl = h("div.stats");
  const scrub = h("input", { type: "range", min: 0, max: F - 1, step: 0.01, value: 0, "aria-label": "Timeline position" });
  const playBtn = h("button.btn", "▶ Play");
  const soundBtn = h("button.btn", { title: "Sound design: a chime per month, pitched by activity" }, "♪ Sound off");
  const speedSel = h("select.btn", { "aria-label": "Speed" }, ["0.5", "1", "2", "4"].map((v) => h("option", { value: v, selected: v === "1" }, v + "×")));

  let pos = 0;
  let playing = false;
  let last = 0;
  let lastWhole = -1;
  let rects = [];
  let W = 0, H = 0, ctx = null;
  let audio = null;
  let soundOn = false;

  const frameSizes = (p) => {
    const a = Math.floor(p), b = Math.min(F - 1, a + 1), t = p - a;
    const A = sizes[a], B = sizes[b];
    const out = new Float32Array(N);
    for (let i = 0; i < N; i++) out[i] = A[i] + (B[i] - A[i]) * t;
    return { out, a, b, t };
  };

  function draw() {
    if (!ctx) return;
    const { out, a } = frameSizes(pos);
    const prev = sizes[Math.max(0, a - 1)];
    ctx.fillStyle = "#0c0c0b";
    ctx.fillRect(0, 0, W, H);
    const dirItems = dirs.map((d) => ({ d, value: filesByDir.get(d).reduce((s2, i) => s2 + out[i], 0) }));
    rects = [];
    for (const dr of squarify(dirItems, 0, 0, W, H)) {
      const color = dirColor.get(dr.it.d);
      const pad = dr.w > 40 && dr.h > 40 ? 3 : 1;
      const head = dr.w > 70 && dr.h > 50 ? 16 : 0;
      const items = filesByDir.get(dr.it.d).map((i) => ({ i, value: out[i] }));
      for (const fr of squarify(items, dr.x + pad, dr.y + pad + head, dr.w - pad * 2, dr.h - pad * 2 - head)) {
        const i = fr.it.i;
        const born = prev[i] === 0 && sizes[a][i] > 0;
        ctx.globalAlpha = born ? 1 : 0.82;
        ctx.fillStyle = color;
        const gx = fr.w > 3 ? 1 : 0, gy = fr.h > 3 ? 1 : 0; // 2px surface gap between tiles
        ctx.fillRect(fr.x + gx, fr.y + gy, Math.max(0.5, fr.w - gx * 2), Math.max(0.5, fr.h - gy * 2));
        if (born) {
          ctx.strokeStyle = css("--text-primary");
          ctx.lineWidth = 1.5;
          ctx.strokeRect(fr.x + 1.5, fr.y + 1.5, Math.max(0, fr.w - 3), Math.max(0, fr.h - 3));
        }
        ctx.globalAlpha = 1;
        if (fr.w > 64 && fr.h > 18) {
          ctx.fillStyle = "rgba(11,11,11,.82)";
          ctx.font = "11px " + css("--mono");
          const name = T.files[i].path.split("/").pop();
          ctx.fillText(name.length * 6.6 > fr.w - 8 ? name.slice(0, Math.max(1, Math.floor((fr.w - 8) / 6.6) - 1)) + "…" : name, fr.x + 5, fr.y + 14);
        }
        rects.push({ ...fr, i });
      }
      if (head) {
        ctx.fillStyle = css("--text-secondary");
        ctx.font = "600 12px " + css("--sans");
        const label = dr.it.d === "(root)" ? "/" : dr.it.d + "/";
        ctx.fillText(label.length * 7 > dr.w - 8 ? label.slice(0, Math.floor((dr.w - 8) / 7)) + "…" : label, dr.x + 5, dr.y + 14);
      }
    }
    const fr = T.frames[a];
    dateEl.textContent = monthLabel(T.frames[Math.round(pos)].t);
    statsEl.replaceChildren(
      ...[
      h("span", h("b", compact(fr.totalLines)), " lines"),
      h("span", h("b", fmt(fr.totalFiles)), " files"),
      h("span", h("b", fmt(fr.commits)), " commits this period"),
      fr.born ? h("span.add", "+" + fmt(fr.born) + " born") : null,
      fr.died ? h("span.del", "−" + fmt(fr.died) + " died") : null,
      fr.authors.length ? h("span", "by ", h("b", fr.authors.join(", "))) : null,
      ].filter(Boolean),
    );
    scrub.value = pos;
  }

  function chime(k) {
    if (!soundOn) return;
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const fr = T.frames[k];
    const now = audio.currentTime;
    if (fr.commits) {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = "sine";
      o.frequency.value = 220 * Math.pow(2, Math.min(3, Math.log2(1 + fr.commits) / 2.2));
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.08, now + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
      o.connect(g).connect(audio.destination);
      o.start(now);
      o.stop(now + 0.55);
    }
    if (fr.died) {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(110, now);
      o.frequency.exponentialRampToValueAtTime(45, now + 0.35);
      g.gain.setValueAtTime(0.09, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
      o.connect(g).connect(audio.destination);
      o.start(now);
      o.stop(now + 0.45);
    }
  }

  function tick(ts) {
    if (!playing) return;
    const dt = last ? (ts - last) / 1000 : 0;
    last = ts;
    const fps = Math.max(2, Math.min(10, F / 20)) * Number(speedSel.value);
    pos = Math.min(F - 1, pos + dt * fps);
    const whole = Math.floor(pos);
    if (whole !== lastWhole) {
      lastWhole = whole;
      chime(whole);
    }
    draw();
    if (pos >= F - 1) setPlaying(false);
    else requestAnimationFrame(tick);
  }
  function setPlaying(on) {
    playing = on;
    playBtn.textContent = on ? "❚❚ Pause" : pos >= F - 1 ? "↺ Replay" : "▶ Play";
    if (on) {
      if (pos >= F - 1) pos = 0;
      last = 0;
      requestAnimationFrame(tick);
    }
  }
  playBtn.addEventListener("click", () => setPlaying(!playing));
  soundBtn.addEventListener("click", () => {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? "♪ Sound on" : "♪ Sound off";
    soundBtn.classList.toggle("on", soundOn);
  });
  scrub.addEventListener("input", () => {
    pos = Number(scrub.value);
    draw();
  });
  canvas.addEventListener("pointermove", (e) => {
    const r = canvas.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const hit = rects.find((q) => mx >= q.x && mx < q.x + q.w && my >= q.y && my < q.y + q.h);
    if (!hit) return hideTip();
    const lines = Math.round(frameSizes(pos).out[hit.i]);
    showTip(e, `<b class="mono">${esc(T.files[hit.i].path)}</b>${ttRow("Lines", fmt(lines))}${ttRow("Language", T.files[hit.i].lang)}`);
  });
  canvas.addEventListener("pointerleave", hideTip);

  const theater = h(
    "div.theater",
    canvas,
    h("div.hud", dateEl, statsEl),
    h("div.controls", playBtn, scrub, speedSel, soundBtn),
  );
  Museum.timelapse = {
    element: theater,
    toggle() {
      setPlaying(!playing);
    },
    step(delta) {
      setPlaying(false);
      pos = Math.max(0, Math.min(F - 1, Math.round(pos) + delta));
      draw();
    },
    mount() {
      hiDpiCanvas(canvas, (c, w, hh) => {
        ctx = c; W = w; H = hh;
        draw();
      });
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduce) {
        pos = F - 1;
        draw();
        return;
      }
      const io = new IntersectionObserver((es) => {
        if (es.some((x) => x.isIntersecting)) {
          io.disconnect();
          setPlaying(true);
        }
      }, { threshold: 0.5 });
      io.observe(canvas);
    },
  };
  const legend = h(
    "div.legend",
    dirs.slice(0, 7).map((d, i) => h("span", h("i", { style: { background: seriesColor(i) } }), d === "(root)" ? "/ (root files)" : d + "/")),
    dirs.length > 7 ? h("span", h("i", { style: { background: css("--series-other") } }), `${dirs.length - 7} other directories`) : null,
    h("span", h("i", { style: { background: "transparent", outline: "1.5px solid " + css("--text-primary") } }), "Newborn file"),
  );
  return h("div", theater, legend);
}

/* Wing 4: the Hall of Survivors. The oldest living code and the layers it sits in. */
function survivorCards() {
  const fns = R.survivors.functions;
  if (!fns.length) return empty("No function definitions could be excavated (unsupported languages or too little history).");
  return h(
    "div.grid.cols-3",
    fns.slice(0, 12).map((f, i) =>
      h(
        "article.card.survivor.reveal",
        h("div.rank", "#" + (i + 1)),
        h("div.fn", f.name + "()"),
        h("div.path", `${f.path}:${f.line}`),
        h("div.big", fmt(f.commitsSurvived)),
        h("div.muted.small", `commits survived · ${plural(f.refactorsSurvived, "refactor")} · ${plural(f.authorsTouched, "author")}`),
        h("p.small", { style: { margin: "10px 0 0", color: "var(--text-secondary)" } }, `Written by ${f.bornBy} on ${date(f.born)}, ${duration(Date.now() / 1000 - f.born)} ago.`),
      ),
    ),
  );
}

/** Code strata: a core sample, one band per year, thickness = surviving lines. */
function strata() {
  const st = R.survivors.strata;
  if (!st.length) return null;
  const total = st.reduce((a, x) => a + x.lines, 0) || 1;
  // Ordinal one-hue ramp (blue), oldest layers darkest, every step >= 2:1 against the dark surface.
  const ramp = ["#184f95", "#1c5cab", "#256abf", "#2a78d6", "#3987e5", "#5598e7", "#6da7ec", "#86b6ef", "#9ec5f4", "#b7d3f6"];
  const color = (k) => ramp[Math.round((k / Math.max(1, st.length - 1)) * (ramp.length - 1))];
  const H = Math.max(260, Math.min(520, st.length * 34));
  const sample = h(
    "div.core-sample",
    { role: "img", "aria-label": "Surviving lines by year written" },
    [...st].reverse().map((x, k) => {
      const idx = st.length - 1 - k;
      const hgt = Math.max(4, (x.lines / total) * H);
      const band = h(
        "div",
        { style: { height: hgt + "px", background: color(idx), color: idx > st.length / 2 ? "#0b0b0b" : "#f0efec" } },
        hgt >= 16 ? h("span", x.year) : null,
        hgt >= 16 ? h("span", `${fmt(x.lines)} lines · ${pct(x.lines / total)}`) : null,
      );
      return tooltip(band, `<b>${x.year}</b>${ttRow("Surviving lines", fmt(x.lines))}${ttRow("Share", pct(x.lines / total))}`);
    }),
  );
  const oldest = st[0];
  const dominant = [...st].sort((a, b) => b.lines - a.lines)[0];
  return h(
    "div.grid.cols-2",
    { style: { alignItems: "start" } },
    sample,
    h(
      "div",
      h("p.placard", R.narrative.placards.strata || ""),
      h("p", { style: { color: "var(--text-secondary)" } }, `The deepest layer dates from ${oldest.year}: ${fmt(oldest.lines)} lines written then are still running today. The thickest layer is ${dominant.year} (${pct(dominant.lines / total)} of what survives).`),
      h("p.muted.small", `Excavated ${fmt(R.survivors.sampledFiles)} files, ${fmt(R.survivors.sampledLines)} lines, with git blame.`),
      tableView("Show strata as a table", ["Year", "Surviving lines", "Share"], st.map((x) => [x.year, fmt(x.lines), pct(x.lines / total)])),
    ),
  );
}

function fossilTable(rows, mode) {
  if (!rows.length) return empty("Nothing here.");
  return h(
    "table.data",
    h("thead", h("tr", h("th", "File"), h("th", mode === "elders" ? "Born" : "Last touched"), h("th", "By"), h("th.num", "Commits"), h("th.num", "Lines"))),
    h(
      "tbody",
      rows.map((f) =>
        h(
          "tr",
          h("td.path-cell", f.path),
          h("td.nowrap", mode === "elders" ? date(f.born) : date(f.lastTouched)),
          h("td", f.bornBy),
          h("td.num", fmt(f.commits)),
          h("td.num", fmt(f.lines)),
        ),
      ),
    ),
  );
}

/* 50-battlefield.js */

/* Wing 6: the Graveyard. Every deleted file gets a tombstone. */
function tombstone(t) {
  const name = t.path.split("/").pop();
  const dir = t.path.slice(0, t.path.length - name.length);
  const stone = h(
    "div.stone",
    t.zombie ? h("span.zombie", { title: "Rose again later" }, "🧟") : null,
    h("div.rip", "R · I · P"),
    h("div.name", name),
    dir ? h("div.dir", dir) : null,
    h("div.dates", `${date(t.born)} – ${date(t.died)}`),
    h("div.epitaph", "“" + t.epitaph + "”"),
    h("div.cause", t.cause),
  );
  return tooltip(
    stone,
    () =>
      `<b class="mono">${esc(t.path)}</b>${ttRow("Lived", duration(t.died - t.born))}${ttRow("Born to", t.bornBy)}${ttRow("Laid to rest by", t.killedBy)}${ttRow("Lines at death", fmt(t.lines))}${ttRow("Peak size", fmt(t.peakLines) + " lines")}${ttRow("Commits", fmt(t.commits))}${
        t.formerNames.length ? ttRow("Also known as", t.formerNames.join(", ")) : ""
      }<div style="margin-top:6px;color:var(--text-muted)">Last words: “${esc(t.lastWords)}”</div>`,
  );
}

function graveyardYard() {
  const g = R.graveyard;
  if (!g.total) return empty("The graveyard is empty. Nothing has ever been deleted.");
  const PAGE = 24;
  let shown = PAGE;
  let filtered = g.tombstones;
  const yard = h("div.yard");
  const more = h("button.btn", { style: { margin: "20px auto 0", display: "block" } }, "Walk further into the graveyard");
  const count = h("span.muted.small");
  const paint = () => {
    yard.replaceChildren(...filtered.slice(0, shown).map(tombstone));
    more.style.display = shown < filtered.length ? "block" : "none";
    count.textContent = `${fmt(Math.min(shown, filtered.length))} of ${fmt(filtered.length)} tombstones${g.total > g.tombstones.length ? ` (the ${fmt(g.tombstones.length)} most notable of ${fmt(g.total)})` : ""}`;
  };
  const search = h("input", { type: "search", placeholder: "Search the dead…", "aria-label": "Search tombstones" });
  const causes = h("select", { "aria-label": "Cause of death" }, h("option", { value: "" }, "Any cause of death"), g.causes.map((c) => h("option", { value: c.cause }, `${c.cause} (${c.count})`)));
  const sort = h(
    "select",
    { "aria-label": "Sort" },
    [["notable", "Most notable"], ["recent", "Most recently buried"], ["oldest", "Longest lived"], ["brief", "Shortest lived"], ["big", "Largest at death"]].map(([v, l]) => h("option", { value: v }, l)),
  );
  const apply = () => {
    const q = search.value.trim().toLowerCase();
    filtered = g.tombstones.filter(
      (t) => (!q || t.path.toLowerCase().includes(q) || t.killedBy.toLowerCase().includes(q) || t.epitaph.toLowerCase().includes(q)) && (!causes.value || t.cause === causes.value),
    );
    const by = {
      notable: null,
      recent: (a, b) => b.died - a.died,
      oldest: (a, b) => b.died - b.born - (a.died - a.born),
      brief: (a, b) => a.died - a.born - (b.died - b.born),
      big: (a, b) => b.lines - a.lines,
    }[sort.value];
    if (by) filtered = [...filtered].sort(by);
    shown = PAGE;
    paint();
  };
  search.addEventListener("input", apply);
  causes.addEventListener("change", apply);
  sort.addEventListener("change", apply);
  more.addEventListener("click", () => {
    shown += PAGE;
    paint();
  });
  paint();
  return h("div", h("div.toolbar", search, causes, sort, count), yard, more);
}

/* 80-constellations.js */
/* Wing 8: Constellations. Files that secretly change together, drawn as a star map. */
function constellationSky() {
  const cs = R.couplings;
  if (!cs.length) return { el: empty("No strong change coupling found: files change independently."), mount() {} };
  const ids = new Map();
  const nodes = [];
  const node = (path) => {
    if (!ids.has(path)) {
      ids.set(path, nodes.length);
      const dir = path.includes("/") ? path.slice(0, path.indexOf("/")) : "(root)";
      nodes.push({ path, dir, x: 0, y: 0, vx: 0, vy: 0, deg: 0 });
    }
    return ids.get(path);
  };
  const edges = cs.map((c) => ({ a: node(c.a), b: node(c.b), w: c.together, conf: c.confidence, cross: c.crossDir }));
  edges.forEach((e) => {
    nodes[e.a].deg += e.w;
    nodes[e.b].deg += e.w;
  });
  const dirRank = new Map();
  [...new Set(nodes.map((n) => n.dir))]
    .map((d) => [d, nodes.filter((n) => n.dir === d).reduce((a, n) => a + n.deg, 0)])
    .sort((a, b) => b[1] - a[1])
    .forEach(([d], i) => dirRank.set(d, i));
  const colorOf = (n) => seriesColor(Math.min(dirRank.get(n.dir), 8));
  const maxW = Math.max(...edges.map((e) => e.w));
  const maxDeg = Math.max(...nodes.map((n) => n.deg));

  // Deterministic seeding on a circle, then a short force simulation.
  nodes.forEach((n, i) => {
    const a = (i / nodes.length) * Math.PI * 2 + (hash(n.path) % 100) / 300;
    n.x = Math.cos(a) * 200;
    n.y = Math.sin(a) * 200;
  });
  for (let it = 0; it < 400; it++) {
    const alpha = 1 - it / 400;
    for (let i = 0; i < nodes.length; i++)
      for (let j = i + 1; j < nodes.length; j++) {
        const p = nodes[i], q = nodes[j];
        let dx = p.x - q.x, dy = p.y - q.y;
        const d2 = Math.max(25, dx * dx + dy * dy);
        const f = (1600 / d2) * alpha;
        dx *= f; dy *= f;
        p.vx += dx; p.vy += dy; q.vx -= dx; q.vy -= dy;
      }
    for (const e of edges) {
      const p = nodes[e.a], q = nodes[e.b];
      const dx = q.x - p.x, dy = q.y - p.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const target = 60 + 80 * (1 - e.conf);
      const f = ((d - target) / d) * 0.05 * alpha * (0.5 + e.w / maxW);
      p.vx += dx * f; p.vy += dy * f; q.vx -= dx * f; q.vy -= dy * f;
    }
    for (const n of nodes) {
      n.vx -= n.x * 0.004 * alpha;
      n.vy -= n.y * 0.004 * alpha;
      n.x += n.vx; n.y += n.vy;
      n.vx *= 0.6; n.vy *= 0.6;
    }
  }

  const canvas = h("canvas", { role: "img", "aria-label": "Change-coupling star map" });
  let view = { k: 1, cx: 0, cy: 0, W: 0, H: 0 }, ctx = null, hover = -1;
  const bounds = () => {
    const xs = nodes.map((n) => n.x), ys = nodes.map((n) => n.y);
    return { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) };
  };
  const toScreen = (n) => [view.W / 2 + (n.x - view.cx) * view.k, view.H / 2 + (n.y - view.cy) * view.k];
  const radius = (n) => 3 + 7 * Math.sqrt(n.deg / maxDeg);

  // Label only the brightest stars, skipping any too close to one already labelled.
  const labelled = new Set();
  function chooseLabels() {
    labelled.clear();
    const placed = [];
    [...nodes.keys()].sort((a, b) => nodes[b].deg - nodes[a].deg).slice(0, 12).forEach((i) => {
      const [x, y] = toScreen(nodes[i]);
      if (placed.every(([px, py]) => Math.abs(px - x) > 90 || Math.abs(py - y) > 16)) {
        placed.push([x, y]);
        labelled.add(i);
      }
    });
  }
  function draw() {
    if (!ctx) return;
    ctx.clearRect(0, 0, view.W, view.H);
    // faint background stars
    for (let i = 0; i < 120; i++) {
      const hv = hash("star" + i);
      ctx.fillStyle = `rgba(240,239,236,${0.04 + (hv % 10) / 100})`;
      ctx.fillRect((hv % 1000) / 1000 * view.W, ((hv >> 10) % 1000) / 1000 * view.H, 1.2, 1.2);
    }
    for (const e of edges) {
      const [x1, y1] = toScreen(nodes[e.a]);
      const [x2, y2] = toScreen(nodes[e.b]);
      const lit = hover === e.a || hover === e.b;
      ctx.strokeStyle = lit ? css("--gold") : e.cross ? "rgba(217,180,90,.45)" : "rgba(195,194,183,.28)";
      ctx.lineWidth = (lit ? 1.5 : 0.8) + 2.5 * (e.w / maxW);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }
    nodes.forEach((n, i) => {
      const [x, y] = toScreen(n);
      const r = radius(n);
      ctx.fillStyle = colorOf(n);
      ctx.shadowColor = colorOf(n);
      ctx.shadowBlur = hover === i ? 18 : 8;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "#0c0c0b";
      ctx.lineWidth = 2;
      ctx.stroke();
      if (hover === i || (labelled.has(i) && hover === -1)) {
        ctx.fillStyle = css("--text-secondary");
        ctx.font = "11px " + css("--mono");
        ctx.fillText(n.path.split("/").pop(), x + r + 4, y + 4);
      }
    });
  }
  const fitView = () => {
    const b = bounds();
    view.cx = (b.x0 + b.x1) / 2;
    view.cy = (b.y0 + b.y1) / 2;
    view.k = Math.min((view.W - 120) / Math.max(1, b.x1 - b.x0), (view.H - 60) / Math.max(1, b.y1 - b.y0), 3);
  };
  canvas.addEventListener("pointermove", (e) => {
    const r = canvas.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    let best = -1, bd = 14 * 14;
    nodes.forEach((n, i) => {
      const [x, y] = toScreen(n);
      const d = (x - mx) ** 2 + (y - my) ** 2;
      if (d < bd) { bd = d; best = i; }
    });
    if (best !== hover) { hover = best; draw(); }
    if (best === -1) return hideTip();
    const n = nodes[best];
    const partners = edges.filter((x) => x.a === best || x.b === best).sort((a, b) => b.w - a.w).slice(0, 5)
      .map((x) => ttRow(nodes[x.a === best ? x.b : x.a].path.split("/").pop(), `${x.w}× · ${Math.round(x.conf * 100)}%`)).join("");
    showTip(e, `<b class="mono">${esc(n.path)}</b><div style="color:var(--text-muted);margin:4px 0">changes together with</div>${partners}`);
  });
  canvas.addEventListener("pointerleave", () => { hover = -1; hideTip(); draw(); });

  const legendDirs = [...dirRank.entries()].sort((a, b) => a[1] - b[1]).slice(0, 8);
  const el = h(
    "div",
    h("div.sky", canvas),
    h(
      "div.legend",
      legendDirs.map(([d, i]) => h("span", h("i", { style: { background: seriesColor(i) } }), d === "(root)" ? "/" : d + "/")),
      dirRank.size > 8 ? h("span", h("i", { style: { background: css("--series-other") } }), "other directories") : null,
      h("span", h("i", { style: { background: "rgba(217,180,90,.6)", height: "3px", borderRadius: "2px" } }), "crosses directories"),
    ),
    tableView(
      "Show coupled pairs as a table",
      ["File A", "File B", "Together", "Confidence", "Cross-directory"],
      cs.map((c) => [h("span.path-cell", c.a), h("span.path-cell", c.b), fmt(c.together), pct(c.confidence), c.crossDir ? "yes" : "no"]),
    ),
  );
  return {
    el,
    mount() {
      hiDpiCanvas(canvas, (c, w, hh) => {
        ctx = c;
        view.W = w;
        view.H = hh;
        fitView();
        chooseLabels();
        draw();
      });
    },
  };
}

/* 90-rhythm.js */
/* Wing 9: Rhythm. When the work happened and how people wrote about it. */
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

function heatmap() {
  const hm = R.rhythm.heatmap;
  const max = Math.max(1, ...hm.flat());
  const cell = 34, gap = 3, left = 40, top = 22;
  const W = left + 24 * (cell + gap);
  const H = top + 7 * (cell + gap);
  // Sequential single hue (blue): near-surface for zero, brightest for the busiest hour.
  const ramp = ["#1f2a38", "#184f95", "#1c5cab", "#256abf", "#2a78d6", "#3987e5", "#5598e7", "#6da7ec", "#86b6ef", "#9ec5f4", "#b7d3f6"];
  const order = [1, 2, 3, 4, 5, 6, 0]; // Monday first
  const g = [];
  for (let hr = 0; hr < 24; hr += 3) g.push(s("text", { x: left + hr * (cell + gap) + cell / 2, y: 14, "text-anchor": "middle" }, String(hr).padStart(2, "0") + ":00"));
  order.forEach((d, row) => {
    g.push(s("text", { x: left - 8, y: top + row * (cell + gap) + cell / 2 + 4, "text-anchor": "end" }, DAYS[d]));
    for (let hr = 0; hr < 24; hr++) {
      const v = hm[d][hr];
      const k = v ? 1 + Math.round((v / max) * (ramp.length - 2)) : 0;
      const r = s("rect", { x: left + hr * (cell + gap), y: top + row * (cell + gap), width: cell, height: cell, rx: 4, fill: ramp[k] });
      tooltip(r, `<b>${DAYS[d]} ${String(hr).padStart(2, "0")}:00–${String(hr).padStart(2, "0")}:59</b>${ttRow("Commits", fmt(v))}`);
      g.push(r);
    }
  });
  const scale = h(
    "div.legend",
    h("span", "fewer"),
    ramp.slice(1).map((c) => h("i", { style: { background: c, marginRight: "2px" } })),
    h("span", "more commits (author's local time)"),
  );
  return h("div.panel", s("svg", { viewBox: `0 0 ${W} ${H}`, class: "chart", role: "img", "aria-label": "Commits by weekday and hour" }, g), scale);
}

function moodBar() {
  const moods = R.rhythm.moods;
  const groups = MOOD_GROUPS.map((g, i) => ({ label: g.label, color: seriesColor(i), value: moods.filter((m) => g.moods.includes(m.mood)).reduce((a, m) => a + m.count, 0) }));
  const other = moods.filter((m) => moodGroupOf(m.mood) === -1).reduce((a, m) => a + m.count, 0);
  if (other) groups.push({ label: "Other", color: css("--series-other"), value: other });
  const total = groups.reduce((a, g) => a + g.value, 0) || 1;
  return h(
    "div",
    h(
      "div.langbar",
      { style: { height: "22px", borderRadius: "6px" }, role: "img", "aria-label": "Commit messages by kind of work" },
      groups.filter((g) => g.value).map((g) => tooltip(h("span", { style: { width: (g.value / total) * 100 + "%", background: g.color } }), `<b>${g.label}</b><br>${fmt(g.value)} commits (${pct(g.value / total)})`)),
    ),
    h("div.legend", groups.filter((g) => g.value).map((g) => h("span", h("i", { style: { background: g.color } }), `${g.label} ${pct(g.value / total)}`))),
  );
}

Museum.wings.push({

/* 95-archive.js */
/* Wing 10: the Archive. A searchable record of recent commits. */
Museum.wings.push({
  id: "archive",
  nav: "Archive",
  render() {
    const all = R.archive;
    const list = h("div.archive-list");
    const PAGE = 60;
    let shown = PAGE;
    let rows = all;
    const more = h("button.btn", { style: { margin: "16px auto 0", display: "block" } }, "Older commits");
    const count = h("span.muted.small");
    const search = h("input", { type: "search", placeholder: "Search messages, authors, hashes…", "aria-label": "Search commits" });
    const mood = h(
      "select",
      { "aria-label": "Kind of work" },
      h("option", { value: "" }, "All kinds of work"),
      MOOD_GROUPS.map((g, i) => h("option", { value: String(i) }, g.label)),
    );
    const row = (c) =>
      h(
        "div.row",
        h("span.h", c.h.slice(0, 8)),
        h("span.s", h("span.mood-dot", { style: { background: moodColor(c.m) }, title: c.m }), c.s),
        h("span.a", c.a),
        h("span.d", date(c.t)),
      );
    const paint = () => {
      list.replaceChildren(...rows.slice(0, shown).map(row));
      more.style.display = shown < rows.length ? "block" : "none";
      count.textContent = `${fmt(Math.min(shown, rows.length))} of ${fmt(rows.length)} commits`;
    };
    let timer = 0;
    const apply = () => {
      const q = search.value.trim().toLowerCase();
      const gi = mood.value === "" ? -1 : Number(mood.value);
      rows = all.filter((c) => (!q || c.s.toLowerCase().includes(q) || c.a.toLowerCase().includes(q) || c.h.startsWith(q)) && (gi === -1 || moodGroupOf(c.m) === gi));
      shown = PAGE;
      paint();
    };
    search.addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(apply, 120);
    });
    mood.addEventListener("change", apply);
    more.addEventListener("click", () => {
      shown += PAGE;
      paint();
    });
    paint();
    return h(
      "section.wing",
      { id: "archive" },
      wingHead("Hall IX", "The Archive", "archive"),
      h("div.toolbar", search, mood, count),
      h("div.panel", { style: { padding: "4px" } }, list),
      more,
    );
  },
});

/* 97-keys.js */
/* Keyboard shortcuts: space/arrows drive the timelapse, [ ] walk the wings, / searches, ? helps. */
(function keys() {
  const SHORTCUTS = [
    ["Space", "Play / pause the timelapse"],
    ["← →", "Step the timelapse one frame"],
    ["[  ]", "Previous / next wing"],
    ["/", "Search the archive"],
    ["?", "Show or hide this help"],
  ];
  const help = h(
    "div.panel",
    {
      role: "dialog",
      "aria-label": "Keyboard shortcuts",
      style: { position: "fixed", right: "20px", bottom: "20px", zIndex: 40, display: "none", minWidth: "280px", boxShadow: "0 12px 40px rgba(0,0,0,.5)" },
    },
    h("div.wing-kicker", { style: { marginBottom: "8px" } }, "Keyboard shortcuts"),
    h("table.data", h("tbody", SHORTCUTS.map(([k, d]) => h("tr", h("td.nowrap", h("code", k)), h("td", d))))),
  );
  document.body.append(help);

  const inView = (el) => {
    if (!el) return false;
    const r = el.getBoundingClientRect();
    return r.bottom > 0 && r.top < innerHeight;
  };
  const sections = () => [...document.querySelectorAll("section.wing")];
  const currentIndex = () => {
    const list = sections();
    let best = 0;
    list.forEach((sec, i) => {
      if (sec.getBoundingClientRect().top <= innerHeight * 0.35) best = i;
    });
    return best;
  };

  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = (e.target && e.target.tagName) || "";
    if (/^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(tag)) {
      if (e.key === "Escape") e.target.blur();
      return;
    }
    const tl = Museum.timelapse;
    if ((e.key === " " || e.key === "ArrowLeft" || e.key === "ArrowRight") && tl && inView(tl.element)) {
      e.preventDefault();
      if (e.key === " ") tl.toggle();
      else tl.step(e.key === "ArrowLeft" ? -1 : 1);
    } else if (e.key === "[" || e.key === "]") {
      const list = sections();
      const next = Math.max(0, Math.min(list.length - 1, currentIndex() + (e.key === "]" ? 1 : -1)));
      list[next].scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    } else if (e.key === "/") {
      const input = document.querySelector("#archive input[type=search]");
      if (input) {
        e.preventDefault();
        input.scrollIntoView({ block: "center" });
        input.focus();
      }
    } else if (e.key === "?") {
      help.style.display = help.style.display === "none" ? "block" : "none";
    } else if (e.key === "Escape") {
      help.style.display = "none";
    }
  });
})();

/* 99-boot.js */
/* Open the doors: render every wing, build the nav, wire up scroll effects. */
(function boot() {
  const main = document.getElementById("museum");
  const nav = document.getElementById("nav");
  nav.append(h("span.brand", "🏺 " + R.overview.name));
  // ?wings=graveyard,gallery renders a subset (embedding, screenshots, slow devices).
  const only = new URLSearchParams(location.search).get("wings");
  const wanted = only ? new Set(only.split(",").map((x) => x.trim())) : null;
  for (const wing of Museum.wings) {
    if (wanted && !wanted.has(wing.id)) continue;
    let section;
    try {
      section = wing.render();
    } catch (err) {
      console.error(`wing ${wing.id} failed`, err);
      section = h("section.wing", { id: wing.id }, h("h2", wing.nav), empty("This wing could not be opened: " + err.message));
    }
    if (!section) continue;
    main.append(section);
    if (wing.nav) nav.append(h("a", { href: "#" + wing.id, "data-wing": wing.id }, wing.nav));
    if (wing.after) requestAnimationFrame(() => wing.after(section));
  }

  const footer = h(
    "footer.epilogue",
    h("div.wing-kicker", "Epilogue"),
    h("p", R.narrative.epilogue),
    h("div.colophon", "Press ? for keyboard shortcuts."),
    h(
      "div.colophon",
      `Excavated by code-archaeologist v${R.version} on ${date(Date.parse(R.generatedAt) / 1000)} · ${R.overview.branch} @ ${R.overview.head.slice(0, 10)} · narration: ${
        R.narrative.source === "offline" ? "offline curator" : `${R.narrative.source} (${R.narrative.model})`
      }`,
    ),
  );
  main.append(footer);

  const links = [...nav.querySelectorAll("a[data-wing]")];
  const spy = new IntersectionObserver(
    (entries) => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        links.forEach((a) => a.classList.toggle("active", a.dataset.wing === e.target.id));
        const active = links.find((a) => a.dataset.wing === e.target.id);
        if (active) active.scrollIntoView({ block: "nearest", inline: "nearest" });
      }
    },
    { rootMargin: "-45% 0px -50% 0px" },
  );
  main.querySelectorAll("section.wing").forEach((sec) => spy.observe(sec));

  const reveal = new IntersectionObserver(
    (entries) => {
      for (const e of entries)
        if (e.isIntersecting) {
          e.target.classList.add("in");
          reveal.unobserve(e.target);
        }
    },
    { rootMargin: "0px 0px -8% 0px" },
  );
  main.querySelectorAll(".reveal").forEach((el) => reveal.observe(el));
})();

</script>
